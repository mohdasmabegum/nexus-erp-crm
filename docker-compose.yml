version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: always
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus_erp_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
