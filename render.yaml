services:
  - type: web
    name: nexus-erp-crm-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: tsx src/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
