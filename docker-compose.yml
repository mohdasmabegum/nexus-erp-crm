version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: always
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus_erp_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexus-server
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:admin123@postgres:5432/nexus_erp_crm"
      JWT_SECRET: "nexus_super_secret_key"
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nexus-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres-data:
